<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stack Visualizer</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      .stack-container {
        border: 4px solid #2e7d32;
        border-top: none;
        width: 200px;
        height: 400px;
        margin: 50px auto;
        display: flex;
        flex-direction: column-reverse; /* Items stack from bottom up */
        align-items: center;
        padding: 10px;
        gap: 5px;
        border-radius: 0 0 10px 10px;
        background: #f4f9f4;
      }

      .stack-item {
        width: 90%;
        height: 40px;
        background-color: #4caf50;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        font-weight: bold;
        /* Animation for entry */
        animation: pushAnim 0.3s ease-out;
      }

      @keyframes pushAnim {
        from {
          transform: translateY(-100px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .popAnim {
        animation: popAnim 0.3s forwards;
      }

      @keyframes popAnim {
        to {
          transform: translateY(-100px);
          opacity: 0;
        }
      }

      .controls {
        text-align: start;
        margin-top: 20px;
      }
      input {
        width: 300px;
        padding: 10px 12px;
        font-size: 16px;

        border: 1px solid #ccc;
        border-radius: 6px;

        outline: none;
        transition: border 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        border-color: #4caf50;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.4);
      }

      button {
        padding: 10px 16px;

        font-size: 14px;
        font-weight: 600;

        border: none;
        border-radius: 6px;

        background: #4caf50;
        color: white;

        cursor: pointer;

        transition: background 0.2s ease, transform 0.1s ease,
          box-shadow 0.1s ease;

        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
      }

      button:hover {
        background: #43a047;
      }

      button:active {
        transform: translateY(1px);
      }
      #hint {
        margin-bottom: 15px;
        width: 30%;
        font-size: 14px;
        background: white;
        padding: 8px 12px;
        border-radius: 6px;
        border-left: 4px solid #4caf50;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 40px;
        background: #f4f9f4;
        color: #333;
      }

      h1 {
        color: #2e7d32;
        margin-bottom: 10px;
      }

      p {
        margin-bottom: 25px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <button onclick="location.href='../index.html'">Back</button>

    <h1>Stack Visualizer (LIFO)</h1>
    <p id="hint">
      Type a value above and hit <strong>Push</strong> to see it slide into the
      stack. Ready to remove it? Hit <strong>Pop</strong>. This demonstrates
      <em>Last-In, First-Out (LIFO)</em> logic in action!
    </p>
    <div class="controls">
      <input type="text" id="stackInput" placeholder="Enter value..." />
      <button id="pushButton">Push</button>
      <button id="popButton" style="background: #e57373">Pop</button>
    </div>

    <div class="stack-container" id="visualStack"></div>

    <script type="module" src="script.js"></script>
  </body>
</html>
