<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue</title>
    <style>
        .queue-container {
            border-top: 4px solid #2e7d32;
            border-bottom: 4px solid #2e7d32;
            width: 80%;
            max-width: 800px;
            height: 100px;
            margin: 50px auto;
            display: flex;
            flex-direction: row; 
            /* This pushes everyone to the "Front" (Right side) */
            justify-content: flex-end; 
            align-items: center;
            padding: 0 10px;
            gap: 10px;
            background: #f4f9f4;
            overflow: hidden;
            position: relative;
        }
        
        /* Entrance Animation: Slide in from Left */
        @keyframes enqueueAnim {
            from { transform: translateX(-100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Exit Animation: Slide out to the Right */
        @keyframes dequeueAnim {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100px); opacity: 0; }
        }
        
        .queue-item {
            min-width: 80px;
            height: 60px;
            background-color: #4CAF50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-weight: bold;
            flex-shrink: 0;
            animation: enqueueAnim 0.4s ease-out;
        }
        
        .dequeueAnim {
            animation: dequeueAnim 0.4s forwards;
        }

button {

    padding: 10px 16px;

    font-size: 14px;
    font-weight: 600;

    border: none;
    border-radius: 6px;

    background: #4CAF50;
    color: white;

    cursor: pointer;

    transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.1s ease;

    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
}

button:hover {
    background: #43a047;
}

button:active {
    transform: translateY(1px);
}
#hint {
    margin-bottom: 15px;
    width: 30%;
    font-size: 14px;
    background: white;
    padding: 8px 12px;
    border-radius: 6px;
    border-left: 4px solid #4CAF50;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 40px;
    background: #f4f9f4;
    color: #333;
}

h1 {
    color: #2e7d32;
    margin-bottom: 10px;
}

p {
    margin-bottom: 25px;
    font-size: 16px;
}

input {
    width: 300px;
    padding: 10px 12px;
    font-size: 16px;

    border: 1px solid #ccc;
    border-radius: 6px;

    outline: none;
    transition: border 0.2s ease, box-shadow 0.2s ease;
}

input:focus {
    border-color: #4CAF50;
    box-shadow: 0 0 5px rgba(76,175,80,0.4);
}
        
        /* Reusing your exact Button, Input, and Hint styles from the Stack... */
    </style>
</head>
<body>
    <button onclick="location.href='../index.html'">Back</button>
    
    <h1>Queue Visualizer (FIFO)</h1>
    <p id="hint">
        Type a value and hit <strong>Enqueue</strong> to join the back of the line. 
        Hit <strong>Dequeue</strong> to remove the person at the front. This is 
        <em>First-In, First-Out (FIFO)</em> logic!
    </p>

    <div class="controls">
        <input type="text" id="queueInput" placeholder="Enter value...">
        <button id="enqueueButton">Enqueue</button>
        <button id="dequeueButton" style="background: #e57373;">Dequeue</button>
    </div>

    <div class="queue-container" id="visualQueue"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
