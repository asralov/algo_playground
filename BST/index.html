<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #tree-display {
        position: relative;
        width: 100%;
        height: 500px;
        margin-top: 50px;

        border-radius: 10px;
        overflow: hidden;
      }

      .node {
        position: absolute;
        width: 40px;
        height: 40px;
        background-color: #4caf50; /* Your green */
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        transition: all 0.5s ease;
        z-index: 2;
        border: 2px solid #2e7d32;
        transition: background-color 0.4s ease, transform 0.4s ease,
          left 0.5s ease, top 0.5s ease;
      }

      .node.traversing {
        background-color: #fdd835; /* Yellow for searching */
        transform: scale(1.2);
      }

      .edge {
        position: absolute;
        background-color: #2e7d32; /* Using your signature dark green */
        height: 2px;
        transform-origin: left center;
        z-index: 1; /* Behind the nodes */
        transition: all 0.5s ease;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 40px;
        background: #f4f9f4;
        color: #333;
      }

      h1 {
        color: #2e7d32;
        margin-bottom: 10px;
      }

      p {
        margin-bottom: 25px;
        font-size: 16px;
      }

      input {
        width: 4%;
        padding: 10px 12px;
        font-size: 16px;

        border: 1px solid #ccc;
        border-radius: 6px;

        outline: none;
        transition: border 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        border-color: #4caf50;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.4);
      }

      button {
        padding: 10px 16px;

        font-size: 14px;
        font-weight: 600;

        border: none;
        border-radius: 6px;

        background: #4caf50;
        color: white;

        cursor: pointer;

        transition: background 0.2s ease, transform 0.1s ease,
          box-shadow 0.1s ease;

        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
      }

      button:hover {
        background: #43a047;
      }

      button:active {
        transform: translateY(1px);
      }

      #hint {
        margin-bottom: 15px;
        width: 30%;
        font-size: 14px;
        background: white;
        padding: 8px 12px;
        border-radius: 6px;
        border-left: 4px solid #4caf50;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>
  <body>
    <button onclick="location.href='../index.html'">Back</button>
    <h1>Binary Search Tree Visualizer</h1>

    <p id="hint">
      <strong>BST Guide:</strong> Enter a number and <strong>Insert</strong> to
      watch the path highlight in
      <span
        style="
          color: #fdd835;
          font-weight: bold;
          background: #444;
          padding: 0 4px;
          border-radius: 3px;
        "
        >yellow</span
      >. Use <strong>Delete</strong> to remove nodes; if it has two children,
      the <span style="color: #2196f3; font-weight: bold">blue</span> highlight
      shows the algorithm finding the replacement!
    </p>

    <div class="controls">
      <input type="number" id="bstInput" />
      <button id="insertBtn">Insert</button>
      <button id="deleteBtn" style="background: #e57373">Delete</button>
    </div>

    <div id="tree-display"></div>

    <script type="module" src="script.js"></script>
  </body>
</html>
